name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download application JAR from CI
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: deploy-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy JAR and restart application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          JAR_FILE="$(find deploy-artifact -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$JAR_FILE"
          scp -o BatchMode=yes "$JAR_FILE" "$VPS_USER@$VPS_HOST:/opt/webservice-session02/app.jar.new"
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" <<'REMOTE'
          set -eu
          cd /opt/webservice-session02
          if [ -f app.jar ]; then
            cp app.jar app.jar.previous
          fi
          mv app.jar.new app.jar
          if sudo -n systemctl restart webservice-session02.service &&
             sudo -n systemctl is-active --quiet webservice-session02.service; then
            rm -f app.jar.previous
          else
            if [ -f app.jar.previous ]; then
              mv app.jar.previous app.jar
              sudo -n systemctl restart webservice-session02.service || true
            fi
            exit 1
          fi
          REMOTE

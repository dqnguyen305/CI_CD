name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download Docker image from CI
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: deploy-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy Docker image and Compose file
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -f deploy-artifact/docker-image.tar.gz
          scp -o BatchMode=yes deploy-artifact/docker-image.tar.gz "$VPS_USER@$VPS_HOST:/tmp/webservice-session02-image.tar.gz"
          scp -o BatchMode=yes compose.yml "$VPS_USER@$VPS_HOST:/opt/webservice-session02/compose.yml.new"
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -eu
          cd /opt/webservice-session02
          test -f .env
          docker load -i /tmp/webservice-session02-image.tar.gz
          mv compose.yml.new compose.yml
          previous_tag="$(cat .image-tag 2>/dev/null || true)"
          if IMAGE_TAG="$IMAGE_TAG" docker compose -f compose.yml up -d --wait --wait-timeout 120; then
            printf '%s\n' "$IMAGE_TAG" > .image-tag.new
            mv .image-tag.new .image-tag
            rm -f /tmp/webservice-session02-image.tar.gz
          else
            if [ -n "$previous_tag" ]; then
              IMAGE_TAG="$previous_tag" docker compose -f compose.yml up -d --wait --wait-timeout 120 || true
            fi
            exit 1
          fi
          REMOTE

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: db_jb_ioc_260310_ss02
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d db_jb_ioc_260310_ss02"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_PASSWORD: ci-only-password
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build
        run: bash ./gradlew clean test bootJar

      - name: Build and export Docker image
        run: |
          mkdir -p docker-context
          JAR_FILE="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$JAR_FILE"
          cp "$JAR_FILE" docker-context/app.jar
          cp Dockerfile docker-context/Dockerfile
          docker build --tag "webservice-session02:${GITHUB_SHA}" docker-context
          docker save "webservice-session02:${GITHUB_SHA}" | gzip -1 > docker-image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz
          if-no-files-found: error
          retention-days: 7

